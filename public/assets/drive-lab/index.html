function startSession(mode='exam',cat='all',amount='40',idsOverride=null){let pool;if(idsOverride)pool=idsOverride.map(id=>BANK.find(q=>q.id===id)).filter(Boolean);else if(mode==='wrong')pool=DB.wrong.map(id=>BANK.find(q=>q.id===id)).filter(Boolean);else if(mode==='star')pool=DB.star.map(id=>BANK.find(q=>q.id===id)).filter(Boolean);else if(cat==='all')pool=(mode==='exam'&&sourceMode==='official')?BANK.filter(q=>q.id<=965):BANK;else pool=BANK.filter(q=>q.category===cat);if(!pool.length){toast('연습할 문제가 없습니다.');return;}let n=mode==='exam'?40:amount==='all'?pool.length:mode==='wrong'||mode==='star'?pool.length:Math.min(+amount,pool.length);let qs;if(mode==='exam'&&sourceMode==='official'){
  const quotas=[['문장형',22],['안전표지형',5],['사진형',6],['일러스트형',7]];
  const seen=new Set();qs=[];
  for(const [cat,count] of quotas){const part=shuffle(pool.filter(q=>q.category===cat));for(const q of part.slice(0,count)){qs.push(q);seen.add(q.id);}}
  qs.push(...shuffle(pool.filter(q=>!seen.has(q.id))).slice(0,n-qs.length));qs=shuffle(qs);
}else qs=shuffle(pool).slice(0,n);DB.session={mode,ids:qs.map(q=>q.id),idx:0,answers:{},revealed:{},start:Date.now(),deadline:mode==='exam'?Date.now()+40*60*1000:null,category:cat};persist();page='session';render();scrollToTop();}
function resume(){if(!DB.session)return toast('이어 풀 학습이 없습니다.');page='session';render();scrollToTop();}
function chosen(q){return DB.session?.answers[q.id]||[]}
function isCorrect(q,answer){let a=[...answer].sort((x,y)=>x-y);return JSON.stringify(a)===JSON.stringify(q.correct)}
function showTime(){let s=DB.session;if(!s||!s.deadline)return '자유 연습';let secs=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function currentQ(){let s=DB.session;return s?BANK.find(q=>q.id===s.ids[s.idx]):null}
function toggleChoice(choice){let s=DB.session,q=currentQ();if(!q||s.revealed[q.id])return;let a=chosen(q),next;if(q.correct.length===1)next=[choice];else next=a.includes(choice)?a.filter(x=>x!==choice):a.length<q.correct.length?[...a,choice]:[a[1],choice];s.answers[q.id]=next;persist();renderSessionQuestion();}
function setQuestion(i){let s=DB.session;if(!s)return;s.idx=Math.max(0,Math.min(s.ids.length-1,i));persist();renderSessionQuestion();}
function step(d){let s=DB.session;if(!s)return;setQuestion(s.idx+d);}
function reveal(){let s=DB.session,q=currentQ();if(!chosen(q).length){toast('먼저 답을 선택하세요.');return;}s.revealed[q.id]=true;DB.seen[q.id]=isCorrect(q,chosen(q));if(DB.seen[q.id])DB.wrong=DB.wrong.filter(x=>x!==q.id);else if(!DB.wrong.includes(q.id))DB.wrong.push(q.id);persist();renderSessionQuestion();}
function starToggle(id){if(DB.star.includes(id))DB.star=DB.star.filter(x=>x!==id);else DB.star.push(id);persist();renderSessionQuestion();toast(DB.star.includes(id)?'즐겨찾기에 추가했어요.':'즐겨찾기에서 해제했어요.');}
function renderSessionQuestion(){if(page!=='session'||!DB.session)return;let s=DB.session,q=currentQ();if(!q){$('app').innerHTML=`${viewHead('SYNC REQUIRED','문제 데이터를 다시 불러와야 해요')}<div class="panel pad"><p>이전에 풀던 문제 데이터가 지금 연결되어 있지 않습니다.</p><button class="btn" onclick="loadOfficial()">공개 문제은행 다시 불러오기</button></div>`;return;}let a=chosen(q),study=s.mode!=='exam',revealed=!!s.revealed[q.id];let answered=s.ids.filter(id=>(s.answers[id]||[]).length).length;let n=s.ids.length;let el=$('app');let chosenText=s.mode==='exam'?'실전 모의고사':s.mode==='wrong'?'오답 다시 풀기':s.mode==='star'?'즐겨찾기 학습':'유형별 연습';let title=`${s.idx+1}<span style="color:#9da9a0;font-weight:500"> / ${n}</span>`;
el.innerHTML=`${viewHead('STUDY SESSION',chosenText,study?'답을 고른 다음 정답 확인을 눌러 해설을 확인하세요.':'실전 모드에서는 제출 전까지 정답을 공개하지 않습니다.')}
<div class="training-layout"><section class="panel question-card"><div class="progress"><i style="width:${(s.idx+1)/n*100}%"></i></div><div class="qnum"><small>QUESTION ${title}</small><div class="row"><span class="pill">${escapeHtml(q.category)}</span><button class="btn small secondary" aria-label="즐겨찾기" onclick="starToggle(${q.id})">${DB.star.includes(q.id)?'★ 저장됨':'☆ 저장'}</button></div></div><div class="question">${escapeHtml(q.question)}</div><div class="row wrap" style="margin-bottom:16px"><span class="pill ${q.correct.length>1?'accent':''}">${q.correct.length===1?'정답 1개 선택':'정답 2개 선택'}</span><span class="smalltext">#${q.id} · ${q.official?'2026.3.9 공개 문제은행':'자체 제작 학습문항'}</span></div>${q.image?`<div class="image-card"><img src="${q.image}" alt="${escapeHtml(q.category)} ${q.id}번 문제 원문 이미지" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div style="display:none" class="note">이미지를 불러오지 못했습니다. 공식 문제은행에서 문항 번호 ${q.id}을 확인하세요.</div><button class="btn small secondary" style="margin-top:9px" onclick="openPreview(${q.id})">원문 이미지 크게 보기 ↗</button></div>`:''}<div class="options">${q.options.map((opt,j)=>{let selected=a.includes(j),right=revealed&&q.correct.includes(j),bad=revealed&&selected&&!right;return `<button class="option ${selected?'selected':''} ${right?'correct':''} ${bad?'incorrect':''}" onclick="toggleChoice(${j})" aria-pressed="${selected}" ${revealed?'disabled':''}><span class="option-index">${j+1}</span><span>${escapeHtml(opt)}</span></button>`}).join('')}</div>${revealed?`<div class="explanation"><b>${isCorrect(q,a)?'✓ 정답입니다.':'✕ 오답입니다.'} · 정답 ${q.correct.map(j=>j+1).join(', ')}번</b>${escapeHtml(q.explanation)}</div>`:''}
<div class="qactions"><div class="row"><button class="btn secondary" onclick="step(-1)" ${s.idx===0?'disabled':''}>← 이전</button><button class="btn secondary" onclick="step(1)" ${s.idx===n-1?'disabled':''}>다음 →</button></div><div class="row">${study&&!revealed?`<button class="btn" onclick="reveal()">정답 확인</button>`:''}${study&&revealed&&s.idx===n-1?`<button class="btn" onclick="finish()">학습 완료</button>`:''}${!study?`<button class="btn" onclick="finish()">시험 제출</button>`:''}</div></div></section>
<aside class="panel exam-side"><div class="timelabel">${study?'학습 모드':'남은 시간'}</div><div class="big-time" id="clock">${study?'∞':showTime()}</div><div class="row between" style="margin-top:14px"><span class="smalltext">진행률</span><b>${answered}/${n}</b></div><div class="progress" style="margin-top:8px"><i style="width:${answered/n*100}%"></i></div><div class="question-grid">${s.ids.map((id,i)=>`<button onclick="setQuestion(${i})" class="${i===s.idx?'current':''} ${(s.answers[id]||[]).length?'answered':''}" aria-label="${i+1}번 문제로 이동">${i+1}</button>`).join('')}</div><div class="smalltext">${study?'정답 확인 후 오답노트가 갱신됩니다.':'답안은 자동 저장됩니다. 40분이 지나면 자동 제출됩니다.'}</div>${s.mode==='exam'?`<button class="btn outline" style="width:100%;margin-top:16px" onclick="finish()">채점하고 종료</button>`:''}<div style="margin-top:13px"><button class="btn small secondary" onclick="go('home')">나중에 이어 풀기</button></div></aside></div>`;}
function calculateAndStore(){const s=DB.session;let correct=0,got=0,max=0;let byCat={};const result=s.ids.map(id=>{let q=BANK.find(x=>x.id===id),a=s.answers[id]||[],ok=isCorrect(q,a);if(ok){correct++;got+=q.points;}max+=q.points;DB.seen[id]=ok;if(ok)DB.wrong=DB.wrong.filter(x=>x!==id);else if(!DB.wrong.includes(id))DB.wrong.push(id);let k=byCat[q.category]||{correct:0,total:0};k.total++;if(ok)k.correct++;byCat[q.category]=k;return {id,ok,answer:a};});let score=Math.round(got/max*100);let record={mode:s.mode,score,correct,count:s.ids.length,at:Date.now(),passed:score>=60,byCat};if(s.mode==='exam'){DB.history.push(record);DB.history=DB.history.slice(-50);}DB.result={record,result};DB.session=null;persist();return record;}
function finish(force=false){if(!DB.session)return;let s=DB.session,answered=s.ids.filter(id=>(s.answers[id]||[]).length).length;let missing=s.ids.length-answered;if(!force&&missing&&!confirm(`${missing}문제를 풀지 않았습니다. 그대로 종료하고 채점할까요?`))return;calculateAndStore();page='result';render();scrollToTop();}
function result(){let d=DB.result;if(!d)return home();let r=d.record,exam=r.mode==='exam';let bad=d.result.filter(x=>!x.ok);return `${viewHead('YOUR RESULT',exam?'모의고사 결과':'연습 결과','학습 결과와 오답 해설을 확인하세요.')}
<div class="panel score-hero"><span class="pill">${exam?'EXAM COMPLETE':'STUDY COMPLETE'}</span><div class="score">${r.score}<small> / 100</small></div><span class="result-tag ${r.passed?'':'fail'}">${r.passed?'60점 이상 · 합격권':'60점 미만 · 추가 학습 권장'}</span><p class="muted" style="margin:12px 0 19px">${r.correct} / ${r.count}문항 정답 · 본 앱의 100점 환산 점수</p><div class="row wrap" style="justify-content:center"><button class="btn" onclick="startSession('exam')">다른 40문제 풀기 →</button><button class="btn secondary" onclick="go('wrong')">오답노트 보기</button></div></div>
<div class="section-title"><h2>틀린 문제 해설</h2><span class="pill">${bad.length}개</span></div><div class="panel pad">${bad.length?bad.map(x=>{let q=BANK.find(z=>z.id===x.id);return `<div class="review-item"><span class="smalltext">${escapeHtml(q.category)} · #${q.id}</span><h3 style="margin-top:5px">${escapeHtml(q.question)}</h3><div class="answerline">내 답: ${x.answer.length?x.answer.map(j=>j+1).join(', ')+'번':'미응답'} / <b>정답: ${q.correct.map(j=>j+1).join(', ')}번</b><br>${escapeHtml(q.explanation)}</div></div>`}).join(''):`<div class="empty"><div class="icon">✓</div><h3>모든 문제 정답!</h3><p>다른 문제로 한 번 더 도전해 보세요.</p></div>`}</div><div class="note">이 결과는 <b>문항을 100점으로 환산한 참고 점수</b>입니다. 공단 실제 시험의 문항별 배점·사진·영상형과 다르므로 실제 합격을 보장하지 않습니다.</div>`}
function openPreview(id){const q=BANK.find(x=>x.id===id);if(!q?.image)return;const el=document.createElement('div');el.id='preview';el.setAttribute('role','dialog');el.setAttribute('aria-label','문항 이미지 확대');el.innerHTML=`<button class="btn small" aria-label="이미지 닫기" onclick="closePreview()">닫기 ✕</button><img src="${q.image}" alt="문항 ${id} 원본 확대 이미지">`;document.body.appendChild(el);document.body.style.overflow='hidden';}
function closePreview(){document.getElementById('preview')?.remove();document.body.style.overflow='';}
async function loadOfficial(){if(sourceMode==='official'){return;}sourceStatus='loading';if(page==='home')render();try{
 const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),12000);
 let response;try{response=await fetch(BANK_URL,{signal:ctrl.signal,cache:'default'});}finally{clearTimeout(timeout);}
 if(!response.ok)throw Error('서버 응답 '+response.status);
 const data=await response.json();if(!Array.isArray(data)||data.length!==1000)throw Error('예상 문항 수 불일치');
 const ids=new Set();const normalized=data.map(d=>{const id=Number(d.i),correct=(d.a||[]).map(x=>Number(x)-1).sort((a,b)=>a-b),opts=d.t==='text'?d.c:Array.from({length:d.nc||4},(_,i)=>'①②③④⑤'[i]);if(!id||!Array.isArray(opts)||opts.length<4||opts.length>5||!correct.length||correct.length>2||correct.some(i=>i<0||i>=opts.length)||ids.has(id))throw Error('문항 검증 실패: '+id);ids.add(id);let category=id<=680?'문장형':id<=780?'안전표지형':id<=880?'사진형':id<=965?'일러스트형':'동영상(정지 카드)';return {id,question:d.q||'다음 원문 이미지를 읽고 올바른 선택지를 고르세요.',options:opts,correct,explanation:d.e||'공개 원본에 제공된 해설이 없는 문항입니다.',category,image:d.t==='img'?`https://raw.githubusercontent.com/may-day-seul/myeonheo-road/63c39913cbe0b548b0c28114c1e6518f09966041/public/q/${id}.jpg`:null,official:true,points:d.t==='img'?3:correct.length===2?3:2};});
 try{localStorage.setItem(OFFICIAL_CACHE_KEY,JSON.stringify(normalized));}catch(e){}
 if(!DB.session){BANK=normalized;sourceMode='official';DATA_KEY='drivelab_progress_official_v1';DB=safeLoad();sourceStatus='ready';render();toast('2026년 문제은행 1,000문항 연결 완료');}else{sourceStatus='ready_next';toast('공개 문제은행을 저장했습니다. 현재 학습을 완료한 뒤 새로고침하세요.');}
 }catch(e){sourceStatus='failed';if(page==='home')render();toast('온라인 문제은행에 연결하지 못했습니다. 내장 문항으로 연습할 수 있습니다.');}}
function clearHistory(){if(!confirm('학습 기록과 오답, 즐겨찾기, 진행 중인 세션까지 모두 삭제할까요?'))return;localStorage.removeItem(DATA_KEY);DB=safeLoad();toast('기록을 초기화했습니다.');render();}
function exportHistory(){let lines=['date,mode,score,correct,count,passed',...DB.history.map(x=>[new Date(x.at).toISOString(),x.mode,x.score,x.correct,x.count,x.passed].join(','))];let blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='drivelab-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('학습 기록을 내보냈습니다.');}
function render(){clearInterval(timer);$('nav').innerHTML=navHtml();$('breadcrumb').textContent='DRIVE LAB / '+(nav.find(x=>x[0]===page)?.[2]||'학습 중');let app=$('app');switch(page){case'home':app.innerHTML=home();if(DB.session)app.insertAdjacentHTML('afterbegin',`<div class="note"><b>진행 중인 학습이 있어요.</b> <button class="btn small" onclick="resume()">이어서 풀기 →</button></div>`);break;case'practice':app.innerHTML=practice();break;case'exam':app.innerHTML=`${viewHead('MOCK EXAM','40문항 실전 모의고사','40분 타이머. 2종 보통 합격선 60점으로 판정하는 연습 시험입니다.')}<div class="panel pad"><div class="illustration"><div><strong>40 Q / 40 MIN</strong><span>시험 모드에서는 정답을 제출 후 공개</span></div></div><div class="row wrap"><span class="pill">${BANK.length}문항 중 랜덤</span><span class="pill">단일·복수 선택 혼합</span><span class="pill">100점 환산</span></div><p class="smalltext" style="margin:17px 0 22px">${sourceMode==='official'?'공개 원문·이미지 문항을 사용하지만 영상 1문항을 문장형으로 대체하고 100점 환산으로 채점하므로 실제 시험과 완전히 같지는 않습니다.':'내장 연습문항으로 구성되어 있으며 사진·영상 문항이 없습니다. 온라인 연결 시 원문 문제은행으로 전환됩니다.'}</p><button class="btn" onclick="startSession('exam')">40분 시험 시작 →</button></div>`;break;case'wrong':app.innerHTML=wrong();break;case'saved':app.innerHTML=saved();break;case'history':app.innerHTML=history();break;case'guide':app.innerHTML=guide();break;case'session':renderSessionQuestion();if(DB.session?.deadline){timer=setInterval(()=>{if(page!=='session'||!DB.session){clearInterval(timer);return;}let el=$('clock');if(el)el.textContent=showTime();if(Date.now()>=DB.session.deadline){clearInterval(timer);toast('시험 시간이 종료되어 자동 제출합니다.');finish(true);}},500);}break;case'result':app.innerHTML=result();break;default:page='home';render();}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('preview')){closePreview();return;}if(page!=='session'||!DB.session)return;if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;let k=e.key;if(['1','2','3','4'].includes(k)){e.preventDefault();toggleChoice(+k-1)}else if(k==='ArrowRight'){e.preventDefault();step(1)}else if(k==='ArrowLeft'){e.preventDefault();step(-1)}});
if(DB.session?.deadline&&Date.now()>=DB.session.deadline){calculateAndStore();page='result';}else if(DB.session)page='home';render();if(sourceMode!=='official')loadOfficial();
</script></body></html>
