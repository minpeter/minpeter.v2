version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep in sync with minimumReleaseAge (1440 min = 1 day) in pnpm-workspace.yaml
    # so weekly version updates never propose a version pnpm's resolver refuses
    # as too new. Security updates ignore cooldown and may still fail resolution
    # until the patch ages past minimumReleaseAge — intended; retry after 24h.
    cooldown:
      default-days: 1
    ignore:
      # vitest 5 pulls why-is-node-running@3.2.2, which lost provenance and is
      # rejected by `trustPolicy: no-downgrade`; it would fail the whole grouped
      # PR. Drop once a vitest 5 release installs cleanly.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/ui"
        update-types: ["version-update:semver-major"]
      # Track the Node major pinned in package.json `engines.node` (24.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
