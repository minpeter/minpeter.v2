name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: TypeScript
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Run TypeScript type check
        run: |
          pnpm check:types

  lint:
    name: Ultracite (Biome)
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run Ultracite check
        run: |
          pnpm check:lint

  build:
    name: Production build
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build production site
        run: pnpm build

  test:
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run tests
        run: |
          pnpm test

  e2e:
    name: Search and instant E2E
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Install browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium chrome

      - name: Run search and instant E2E
        run: >-
          pnpm test:e2e --
          e2e/blog-search.client.spec.ts
          e2e/blog-search.stale.client.spec.ts
          e2e/soft-nav.instant.spec.ts
          e2e/site-journeys.spec.ts
          e2e/language-selector.spec.ts
          e2e/error-recovery.spec.ts
          e2e/products-spin.spec.ts
          e2e/product-customization.spec.ts

      - name: Preserve browser screenshots for visual review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.md
          retention-days: 3
          if-no-files-found: warn
          compression-level: 0

  audit:
    name: Security audit
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run production dependency audit
        run: pnpm audit --prod
