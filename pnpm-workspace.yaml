# Keep the one-day release-age gate explicit and load-bearing: together with
# minimumReleaseAgeStrict it makes pnpm FAIL resolution on too-new versions
# instead of silently falling back to them.
# Keep in sync with cooldown.default-days in .github/dependabot.yml
# (1440 min = 1 day).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade

# pnpm 12 otherwise prepends an environment document pinning pnpm itself to
# pnpm-lock.yaml, and GitHub's dependency graph / Dependabot read only that
# first document (dependabot-core#15904), so they would see no dependencies.
# `ignore` keeps the lockfile one document; CI still installs the pinned pnpm
# from package.json#packageManager via pnpm/setup.
pmOnFail: ignore

overrides:
  source-map-js: ">=1.2.2"
  vite: ">=8.1.6"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
