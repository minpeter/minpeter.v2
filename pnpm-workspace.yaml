# Keep the one-day release-age gate explicit and load-bearing: together with
# minimumReleaseAgeStrict it makes pnpm FAIL resolution on too-new versions
# instead of silently falling back to them.
# Keep in sync with cooldown.default-days in .github/dependabot.yml
# (1440 min = 1 day).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true

overrides:
  # mdast-util-to-markdown 2.1.3 serializes strong/emphasis via the handler's
  # `.attention` prop. fumadocs-core <=16.15.14's MDX stringifier
  # (includeProcessedMarkdown) wraps handlers and drops it, so `next build`
  # recurses forever. Fixed upstream in fumadocs-core 16.15.15:
  # https://github.com/fuma-nama/fumadocs/issues/3604
  # The selector only matches fumadocs-core <16.15.15, so it stops applying
  # once fumadocs-core is bumped; delete it then. Note: pnpm dedupes the
  # runtime importers (remark-stringify, mdast-util-gfm-*) onto the same
  # 2.1.2, so in practice the whole tree resolves to 2.1.2 while this applies.
  # Guarded by shared/processed-markdown.test.ts.
  "fumadocs-core@<16.15.15>mdast-util-to-markdown": 2.1.2
