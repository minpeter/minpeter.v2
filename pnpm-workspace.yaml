# Keep the one-day release-age gate explicit and load-bearing: together with
# minimumReleaseAgeStrict it makes pnpm FAIL resolution on too-new versions
# instead of silently falling back to them.
# Keep in sync with cooldown.default-days in .github/dependabot.yml
# (1440 min = 1 day).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true

overrides:
  # mdast-util-to-markdown 2.1.3 serializes strong/emphasis via handler
  # `.attention` props; fumadocs-core's stringifier (includeProcessedMarkdown)
  # wraps handlers and drops them -> infinite recursion at build time.
  # Remove once fumadocs-core is compatible.
  mdast-util-to-markdown: 2.1.2
